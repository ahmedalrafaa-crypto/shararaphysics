  ch: "g6c3",
  lesson: "2",
  title: "دائرة تيار متناوب تحتوي مقاومة صرفة R",
  // نفس أسئلة "اختبر نفسك" الموجودة بنهاية الدرس (lesson2.html) — إعادة استخدام بدل التكرار.
  questions: [
  { q: "بدائرة تحتوي مقاومة صرفة R فقط، ما فرق الطور Φ بين الفولطية والتيار؟",
    opts: [ "180°", "90°","0°", "45°"], a: 2,
    why: "بمقاومة صرفة، الفولطية والتيار يبلغان الذروة معاً ويصفران معاً — أي بطور واحد، Φ=0." },
  { q: "لماذا لا تنخفض القدرة اللحظية بمقاومة صرفة تحت الصفر أبداً؟",
    opts: ["لأن V وI موجبتان دائماً بحكم تعريفهما", "القدرة فعلاً تنخفض تحت الصفر أحياناً بمقاومة صرفة", "لأن المقاومة تمنع القدرة السالبة بقانون خاص بها", "لأن P=V×I، وV وI متطابقتان بالإشارة كل لحظة (بطور واحد)، فحاصل ضربهما موجب دائماً"], a: 3,
    why: "بما أن V وI بطور واحد، فهما يتشاركان نفس الإشارة بكل لحظة (موجبتين معاً أو سالبتين معاً)، وحاصل ضرب عددين بنفس الإشارة نتيجته موجبة دائماً." },
  { q: "دائرة مقاومة صرفة R=50Ω مربوطة بمصدر V_m=100V. ما مقدار التيار الأعظم I_m؟",
    opts: ["2 A", "0.5 A", "5 A", "50 A"], a: 0,
    why: "I_m = V_m/R = 100/50 = 2 A." },
  { q: "بنفس الدائرة أعلاه (R=50Ω, V_m=100V, I_m=2A)، ما القدرة المتوسطة P_av؟",
    opts: [ "200 W","100 W", "50 W", "141 W"], a: 1,
    why: "P_av = I_m×V_m/2 = 2×100/2 = 100 W." },
  { q: "كم مرة تبلغ القدرة اللحظية ذروتها خلال دورة واحدة كاملة للفولطية؟",
    opts: ["مرة واحدة", "أربع مرات", "مرتان", "لا تبلغ ذروة أبداً"], a: 2,
    why: "القدرة تتناسب مع sin²(ωt) اللي ترددها ضعف تردد V وI، فتبلغ ذروتها مرتين كل دورة — ولهذا يومض المصباح المتصل بالمتناوب 100 مرة بالثانية عند f=50Hz." },
  { q: "يقول زميلك: بما أن متوسط التيار المتناوب الجيبي صفر، فهو لا يعطي أي قدرة. أين الخطأ؟",

]
