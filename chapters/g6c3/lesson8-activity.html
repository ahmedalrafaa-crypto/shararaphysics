    why: "نجمع تيارات الفروع متجهياً: I_R مرجع، و(I_C−I_L) هو المحصّلة الشاقولية، فـI_T هو وتر المثلث الناتج." },

    why: "بالتوازي: I_L>I_C ⟹ الدائرة حثّية الخواص (عكس اتجاه المقارنة بالتوالي تماماً)." },
  { q: "بدائرة توالية، الحكم على نوع الدائرة يعتمد على مقارنة X_L بـX_C مباشرة. بدائرة توازي، على أي كمية تعتمد المقارنة بدلاً من ذلك؟",
