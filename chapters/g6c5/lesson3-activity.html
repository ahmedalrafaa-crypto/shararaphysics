  { q: "نمط التداخل بتجربة شقي يونك يتولّد بسبب:",
    opts: ["الانعكاس فقط", "الانكسار فقط", "حيود وتداخل موجات الضوء معاً", "الاستقطاب فقط"], a: 2,
    why: "تحيد الموجات بالشقين الضيقين فتصير مصدرين متشاكهين، ثم تتداخل: بناءً وإتلافاً بالتعاقب فيظهر الهدب. (اختيار وزاري: 2021د1)" },
  { q: "أُجريت تجربة يونك تحت سطح الماء بدل الهواء. ماذا يحصل لفاصلة الهدب؟",
