var ACTIVITY = {
  ch: "g6c4",
  lesson: "7",
  title: "التضمين — AM وFM وPM",
  // نفس أسئلة "اختبر نفسك" الموجودة بنهاية الدرس (lesson7.html) — إعادة استخدام بدل التكرار.
  questions: [
  { q: "لماذا لا نُرسل إشارة الصوت مباشرة كما هي عبر الهواء بدل تضمينها على موجة حاملة؟",
    opts: ["لأن ترددها منخفض جداً، فتحتاج هوائياً طويلاً جداً (كيلومترات) وتنتشر بضعف شديد", "لأن الصوت لا يمكن تحويله لإشارة كهربائية إطلاقاً", "لأن الأذن البشرية لا تسمع الترددات العالية فقط", "لا يوجد سبب فيزيائي حقيقي لذلك"], a: 0,
    why: "تردد الصوت منخفض جداً (مئات الهرتز)، فيحتاج هوائياً بطول غير عملي (كيلومترات) وينتشر بكفاءة ضعيفة جداً — لذا نُحمِّله على موجة حاملة عالية التردد." },
  { q: "ما الذي يتغيّر بالتضمين السعوي AM، وماذا يبقى ثابتاً؟",
    opts: [ "يتغيّر تردد الموجة الحاملة، وتبقى سعتها ثابتة","تتغيّر سعة الموجة الحاملة وفق إشارة المعلومة، ويبقى ترددها ثابتاً", "يتغيّران معاً بنفس الوقت دائماً", "لا يتغيّر أي منهما، بل يتغيّر الطور فقط"], a: 1,
    why: "AM = Amplitude Modulation: نغيّر سعة (مقدار) الموجة الحاملة كدالة خطية وفق تردد إشارة المعلومة، مع ثبوت تردّدها." },
  { q: "ما الذي يتغيّر بالتضمين الترددي FM؟",
    opts: [ "طور الموجة الحاملة فقط", "سعة الموجة الحاملة فقط، مع ثبوت ترددها","تردد الموجة الحاملة يتغيّر وفق سعة إشارة المعلومة، مع ثبوت سعة الحاملة", "لا شيء يتغيّر إطلاقاً بـFM"], a: 2,
    why: "FM = Frequency Modulation: نغيّر تردد الموجة الحاملة وفق سعة إشارة المعلومة، مع ثبوت سعتها." },
  { q: "لماذا يكون صوت راديو FM عادة أنقى وأقل تشويشاً من AM (خصوصاً أثناء العواصف الرعدية)؟",
    opts: [ "لا فرق حقيقي بين نقاوة الاثنين إطلاقاً", "لأن محطات FM أقوى إرسالاً من AM دائماً بلا استثناء", "لأن الأذن البشرية تفضّل الترددات المستعملة بـFM فقط","لأن المعلومة بـFM محمولة بالتردد، والتشويش الجوي (كالبرق) يغيّر السعة أساساً لا التردد"], a: 3,
    why: "تشويش كالبرق يؤثر أساساً بسعة الموجة الملتقطة؛ بما أن معلومة AM محمولة بالسعة فتتأثر بوضوح، بينما معلومة FM محمولة بالتردد فلا يكاد التشويش يؤثر بها." },
  { q: "ما التضمين الطوري PM؟",
    opts: ["تغيير طور الموجة الحاملة وفق سعة إشارة المعلومة", "تغيير سعة الموجة الحاملة فقط", "تغيير تردد الموجة الحاملة فقط", "إلغاء الموجة الحاملة كلياً واستبدالها بالإشارة مباشرة"], a: 0,
    why: "PM = Phase Modulation: نغيّر طور الموجة الحاملة وفق سعة إشارة المعلومة." },
  { q: "ما ميزة التضمين الرقمي (Digital) مقارنة بالتضمين التماثلي (Analog)؟",
    opts: [ "لا يحتاج أي موجة حاملة إطلاقاً","يحوّل المعلومة إلى نبضات، فيقلّل تأثير التشويش الخارجي ويرفع دقّة الإرسال والتسلم", "أبطأ دائماً من التضمين التماثلي", "يعمل فقط مع الصوت لا الصورة أو البيانات"], a: 1,
    why: "التضمين الرقمي يحوّل المعلومة لنبضات منفصلة، وهذا يقلّل تأثير التشويش الخارجي مقارنة بالإشارة التماثلية المستمرة، فترتفع دقّة الإرسال والتسلم." }
]
};
