  { q: "بماذا نولّد عملياً الشحنات المتذبذبة اللازمة لإشعاع الموجات الكهرومغناطيسية؟",
    opts: ["مولّد الذبذبات (oscillator) موصولاً بساقين معدنيين (ثنائي قطب كهربائي)", "بطارية اعتيادية موصولة بسلك مستقيم بلا حركة", "مغناطيس دائم ساكن دون أي دائرة كهربائية", "مقاومة كهربائية ثابتة القيمة فقط"], a: 0,

  { q: "ماذا يحدث لتردد الموجة الكهرومغناطيسية المُشعَّة إذا زاد تردد تذبذب الشحنة بمولّد الذبذبات؟",

    why: "تُشِعّ الشحنة المتذبذبة موجة كهرومغناطيسية بالتردد نفسه لتذبذبها بالضبط — فزيادة تردد التذبذب تعني زيادة مساوية بتردد الموجة المُشعَّة." },

]
