var ACTIVITY = {
  ch: "g6c4",
  lesson: "1",
  title: "مقدمة",
  // نفس أسئلة "اختبر نفسك" الموجودة بنهاية الدرس (lesson1.html) — إعادة استخدام بدل التكرار.
  questions: [
  { q: "لماذا يصلنا ضوء الشمس عبر الفراغ بينما لا يصلنا أي صوت من الفضاء؟",
    opts: ["لأن الضوء موجة كهرومغناطيسية لا تحتاج وسطاً ماديّاً، بينما الصوت موجة ميكانيكية تحتاج جزيئات مادة تهتزّ", "لأن الصوت أبطأ من الضوء فقط ولم يصل بعد", "لأن الفضاء يمتص الصوت بالكامل رغم قدرته على الانتقال به", "لا فرق حقيقي، والصوت يصل لكن بشدة ضعيفة جداً"], a: 0,
    why: "الموجة الكهرومغناطيسية تحمل مجاليها الكهربائي والمغناطيسي معها فلا تحتاج وسطاً، بعكس الصوت (موجة ميكانيكية) الذي يحتاج جزيئات مادة يهتزّ بها." },
  { q: "ما الذي يجمع بين الضوء المرئي وموجة الراديو وأشعة گاما رغم اختلاف استعمالاتها كلياً؟",
    opts: [ "لا يجمعها شيء إطلاقاً، فكل منها نوع فيزيائي مختلف كلياً","كلها موجات كهرومغناطيسية من الطبيعة نفسها، لا تختلف إلا بالتردد وطول الموجة", "كلها موجات ميكانيكية تحتاج وسطاً مادياً للانتقال", "كلها تنتقل بنفس السرعة تماماً في كل الأوساط المادية"], a: 1,
    why: "كل موجات الطيف الكهرومغناطيسي (راديو، مرئي، گاما...) نوع فيزيائي واحد، تختلف فيما بينها بالتردد وطول الموجة فقط، وتنتقل جميعها بسرعة الضوء بالفراغ." },
  { q: "ما حجم الضوء المرئي مقارنة بالطيف الكهرومغناطيسي الكامل؟",
    opts: [ "الطيف الكهرومغناطيسي كله تقريباً", "نصف الطيف الكهرومغناطيسي تقريباً","شريحة ضيقة جداً فقط من طيف واسع جداً", "لا علاقة للضوء المرئي بالطيف الكهرومغناطيسي إطلاقاً"], a: 2,
    why: "عين الإنسان تكشف فقط شريحة ضيقة جداً من الطيف الكهرومغناطيسي الواسع (٤٠٠-٧٠٠ نانومتر تقريباً)، بينما يمتد الطيف من موجات الراديو حتى أشعة گاما." },
  { q: "أي المناطق التالية بالطيف الكهرومغناطيسي أعلى تردداً؟",
    opts: [ "الأشعة تحت الحمراء", "موجات الراديو", "المايكروويف","أشعة گاما"], a: 3,
    why: "ترتيب الطيف من أوطأ تردد لأعلاه تقريباً: راديو ← مايكروويف ← تحت الحمراء ← مرئي ← فوق البنفسجية ← سينية ← گاما (الأعلى تردداً والأقصر طول موجة)." }
]
};
