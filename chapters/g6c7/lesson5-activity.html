  questions: [
  { q: "ماذا يحدث للإلكترونات الحرة الكثيرة بجهة n عند تكوين وصلة pn؟",
    opts: ["تبقى ثابتة تماماً بجهة n ولا تتحرك إطلاقاً", "تنتشر عبر الوصلة إلى جهة p وتتحد مع فجوات هناك (إعادة اتحاد)", "تنتقل جميعها فوراً إلى خارج البلورة كلياً", "تتحول إلى فجوات مباشرة بلا أي انتقال"], a: 1,
    why: "فرق التركيز يدفع الإلكترونات الحرة للانتشار من n (تركيز عالٍ) إلى p (تركيز منخفض)، حيث تتحد فوراً مع الفجوات هناك." },
  { q: "ما الذي يبقى فعلياً داخل منطقة الاستنزاف بعد اكتمال الانتشار وإعادة الاتحاد؟",
    opts: ["فائض كبير من الإلكترونات الحرة المتحركة", "فائض كبير من الفجوات المتحركة", "لا يوجد أي شيء إطلاقاً؛ منطقة فارغة من المادة بالكامل", "أيونات ثابتة فقط (موجبة بجهة n وسالبة بجهة p)، بلا حاملات شحنة حرة تقريباً"], a: 3,

    why: "جهد الحاجز النموذجي لثنائي السيليكون عند التوازن يساوي تقريباً 0.7V (مقابل ≈0.3V للجرمانيوم)." },
  { q: "لماذا يتوقف الانتشار عبر الوصلة pn تلقائياً عند الوصول إلى التوازن، بدل أن يستمر حتى تختفي كل حاملات الشحنة؟",

  { q: "بطعّم ثنائي pn بنسبة شوائب أعلى (تطعيم أكثف)، مع بقاء المادة ودرجة الحرارة ثابتتين. ماذا يحدث لمقدار جهد الحاجز عادة؟",
