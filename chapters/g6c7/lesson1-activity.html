  lesson: "1",
  title: "مقدمة ومستويات الطاقة في الذرة",
  // نفس أسئلة "اختبر نفسك" الموجودة بنهاية الدرس (lesson1.html) — إعادة استخدام بدل التكرار.
  questions: [
  { q: "من اخترع أول ترانزستور عام 1947، وأين؟",
    opts: ["توماس إديسون، بمختبره الخاص", "ماكس بلانك، بجامعة برلين", "باردين وبراتين وشوكلي، بمختبرات Bell", "ألبرت أينشتاين، بجامعة برينستون"], a: 2,
    why: "اخترع العلماء باردين وبراتين وشوكلي أول ترانزستور بمختبرات Bell عام 1947، بديلاً عن الصمام المفرغ." },
  { q: "ما أبرز عيوب الصمام المفرغ (Vacuum Tube) مقارنة بالترانزستور؟",
    opts: ["حجم كبير، استهلاك طاقة عالٍ لتسخين الفتيل، وعمر قصير", "حجم أصغر من الترانزستور بكثير", "لا يحتاج أي طاقة كهربائية للعمل", "لا يُستخدم إطلاقاً بأي جهاز إلكتروني قديم"], a: 0,
    why: "الصمام المفرغ كبير الحجم، يحتاج فتيلاً ساخناً يستهلك طاقة عالية، ويحترق ويتعطّل بسرعة نسبياً — عكس الترانزستور الصلب المدمج." },
  { q: "ماذا يعني وصف إلكترونيات اليوم بـ«إلكترونيات الحالة الصلبة»؟",
    opts: ["أنها إلكترونيات لا تعمل إلا بدرجات حرارة متجمدة", "أنها إلكترونيات مصنوعة بالكامل من المعادن الصلبة فقط", "أنها إلكترونيات لا تحتوي أي إلكترونات متحركة إطلاقاً", "أنها تُبنى من نبائط مصنوعة من مواد صلبة بلورية (كأشباه الموصلات)، لا من صمامات مفرغة من الهواء"], a: 3,
    why: "«الحالة الصلبة» تعني أن التحكم بالتيار يتم داخل بلورة مادة صلبة (شبه موصل) بدل أنبوب مفرغ من الهواء يحوي فتيلاً ساخناً." },
  { q: "وفق النموذج الذري، متى يمكن لإلكترون أن ينتقل من مستوى طاقة إلى آخر أعلى؟",

    why: "مستويات الطاقة مكمّمة ومنفصلة؛ لا ينتقل الإلكترون إلا إذا اكتسب طاقة تساوي بالضبط فرق الطاقة بين المستويين، لا أقل ولا أكثر." },

    why: "مبدأ باولي يمنع تطابق الحالات الكمية لإلكترونين بنفس النظام، فيضطر كل مستوى مشترك أصلاً بين N ذرة للانشطار إلى N مستوى متمايز طفيفاً عن بعضه." },
  { q: "طاقة الإلكترون بمستواه الأرضي في ذرة الهيدروجين تساوي −13.6eV. كم مقدار الطاقة اللازمة لتحريره تماماً من الذرة (نقله إلى المستوى الصفري E=0)؟",
    opts: ["−13.6 eV", "0 eV", "+13.6 eV", "+27.2 eV"], a: 2,
    why: "الانتقال من −13.6eV إلى المستوى الصفري E=0 يتطلب اكتساب فرق الطاقة نفسه بالضبط: 0−(−13.6)=+13.6eV." },
  { q: "فوتون طاقته 4×10⁻¹⁹J يمكن أن ينقل إلكتروناً بين مستويين طاقتهما تفصل بينهما بالضبط بنفس المقدار. ماذا يحدث لو كانت طاقة الفوتون الساقط أكبر أو أصغر من هذا الفرق؟",
    opts: ["يُمتص الفوتون دائماً بغض النظر عن طاقته", "ينتقل الإلكترون دائماً مهما كانت طاقة الفوتون", "لا يُمتص الفوتون ولا ينتقل الإلكترون بينهما", "تنبعث طاقة إضافية من الذرة تلقائياً لتعويض الفرق"], a: 2,
    why: "الانتقال بين مستويين مكمّمين يتطلب طاقة تساوي الفرق بالضبط؛ أي طاقة أخرى (أكبر أو أصغر) لا تُمتص لإحداث هذا الانتقال المحدد." }
