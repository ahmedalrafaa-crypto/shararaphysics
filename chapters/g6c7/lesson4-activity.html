var ACTIVITY = {
  ch: "g6c7",
  lesson: "4",
  title: "أشباه الموصلات المطعّمة",
  // نفس أسئلة "اختبر نفسك" الموجودة بنهاية الدرس (lesson4.html) — إعادة استخدام بدل التكرار.
  questions: [
  { q: "ماذا نسمي عملية إضافة كمية صغيرة ومضبوطة من عنصر شائبة إلى بلورة شبه موصل نقي؟",
    opts: ["التبريد", "التطعيم (Doping)", "التبخير", "الانصهار"], a: 1,
    why: "التطعيم هو الاسم العلمي لإضافة شوائب متحكَّم بها لتغيير توصيلية شبه الموصل ونوع حامل الشحنة الغالب فيه." },
  { q: "لتكوين شبه موصل من النوع n، أي عنصر يجب أن نطعّم به السيليكون؟",
    opts: ["عنصر ثلاثي التكافؤ (٣ إلكترونات تكافؤ) كالبورون", "عنصر رباعي التكافؤ نفسه كالسيليكون تماماً", "أي غاز خامل بلا إلكترونات تكافؤ إطلاقاً", "عنصر خماسي التكافؤ (٥ إلكترونات تكافؤ) كالزرنيخ أو الفوسفور"], a: 3,
    why: "الشائبة الخماسية التكافؤ تمنح إلكتروناً خامساً زائداً بعد تكوين ٤ روابط، فينتج فائض إلكترونات حرة — النوع n." },
  { q: "لماذا تُسمى ذرة الشائبة الثلاثية التكافؤ (كالبورون) «ذرة مستقبِلة»؟",
    opts: ["لأنها جاهزة لاستقبال إلكترون من رابطة مجاورة يملأ فجوتها الناقصة", "لأنها تمنح إلكتروناً إضافياً للبلورة", "لأنها تستقبل فوتونات الضوء فقط دون أي دور كهربائي", "لأنها تطرد كل الإلكترونات المجاورة لها"], a: 0,
    why: "الشائبة الثلاثية التكافؤ تترك رابطة ناقصة إلكتروناً (فجوة)، جاهزة «لاستقبال» أي إلكترون مجاور يقفز إليها — لذا تُسمى مستقبِلة." },
  { q: "ما حاملات الشحنة الأغلبية في شبه موصل من النوع p؟",
    opts: ["الإلكترونات الحرة فقط", "البروتونات الحرة المتحركة", "الفجوات (حاملات موجبة)", "النيوترونات الحرة المتحركة"], a: 2,
    why: "في النوع p، التطعيم بعنصر ثلاثي التكافؤ يولّد فائضاً كبيراً من الفجوات — فهي حاملات الشحنة الأغلبية." },
  { q: "قطعة سيليكون مطعّمة بالنوع n. أي عبارة صحيحة بخصوص شحنتها الكلية؟",

    why: "التطعيم لا يضيف أي شحنة صافية؛ ذرة الشائبة متعادلة أصلاً، فيبقى صافي شحنة البلورة كلها صفراً، رغم تغيّر توزيع حاملات الشحنة الحرة." },
  { q: "ما الفرق الجوهري بين حاملات الشحنة الأقلية في النوع n وحاملات الشحنة الأغلبية فيه؟",

    why: "الإلكترونات الحرة (الأغلبية بالنوع n) مصدرها الأساسي التطعيم المتعمَّد بالشائبة المانحة، بينما الفجوات القليلة جداً (الأقلية) تنتج فقط من كسر حراري عرضي لروابط تساهمية، تماماً كما بالبلورة النقية." },
  { q: "أين يقع المستوى القابل (Acceptor Level) بالضبط داخل الفجوة الطاقية المحظورة، وماذا يحدث لمستوى فيرمي عند تولّده؟",
    opts: ["تحت حزمة التوصيل مباشرة، ويرتفع فيرمي للأعلى", "في منتصف الفجوة تماماً، ويبقى فيرمي ثابتاً", "فوق حزمة التكافؤ مباشرة، وينخفض فيرمي نحو الأسفل", "خارج الفجوة الطاقية كلياً، بلا أي أثر على فيرمي"], a: 2,
    why: "المستوى القابل يتولّد عند التطعيم بشوائب ثلاثية التكافؤ (النوع p)، ويقع فوق حزمة التكافؤ مباشرة، فينخفض مستوى فيرمي نحو الأسفل ويقترب من حزمة التكافؤ." }
]
