var ACTIVITY = {
  ch: "g6c7",
  lesson: "8",
  title: "الترانزستور",

  questions: [
  { q: "ما الأطراف الثلاثة للترانزستور ثنائي القطبية (BJT)؟",
    opts: ["الأنود والكاثود والقاعدة", "الباعث والقاعدة والمجمع", "الموجب والسالب والمحايد", "المصدر والبوابة والمصرف"], a: 1,
    why: "أطراف الترانزستور الثلاثة هي: الباعث (Emitter)، القاعدة (Base)، والمجمع (Collector)." },
  { q: "لماذا يجب أن تكون منطقة القاعدة رقيقة جداً ومطعّمة تطعيماً خفيفاً؟",

    why: "رقّة القاعدة وتطعيمها الخفيف يقلّلان إعادة الاتحاد بداخلها، فتعبر أغلب حاملات الشحنة إلى المجمع، وهذا أساس عمل الترانزستور كمكبّر فعّال." },
  { q: "ما العلاقة الصحيحة بين تيارات الترانزستور الثلاثة؟",

  { q: "في مضخّم قاعدة مشتركة: I_E=2mA وI_C=1.9mA وR_in=200Ω وR_out=100kΩ. جد ربح التيار α تقريباً.",
    opts: ["≈0.95", "≈1.05", "≈2", "≈500"], a: 0,
    why: "α=I_C/I_E=1.9/2=0.95 — أقل من الواحد كما هو متوقّع بمضخّم القاعدة المشتركة." },
  { q: "بأي وضعية انحياز يعمل الترانزستور عادة عند استعماله كمكبّر (Amplifier)؟",
