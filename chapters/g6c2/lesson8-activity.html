  questions: [
  { q: "ما القوة التي تدفع الشحنات لتتحرك في حلقة موصلة ساكنة تماماً موضوعة في مجال مغناطيسي متغيّر؟",
    opts: ["قوة لورنتز الحركية (F=qvB) فقط", "مجال كهربائي محتث ينشأ بسبب تغيّر المجال المغناطيسي", "لا توجد أي قوة، ولن يمرّ أي تيار في الحلقة", "قوة الجاذبية الأرضية"], a: 1,
    why: "بما أن الحلقة ساكنة (v=0) فلا قوة لورنتز حركية. التغيّر في B نفسه يولّد مجالاً كهربائياً محتثاً يدفع الشحنات." },
  { q: "ما الفرق الجوهري بين خطوط المجال الكهربائي المستقر وخطوط المجال الكهربائي المحتث؟",
    opts: ["لا فرق بينهما إطلاقاً", "خطوط المستقر تبدأ من شحنة موجبة وتنتهي بسالبة، بينما خطوط المحتث مغلقة بلا بداية أو نهاية", "خطوط المحتث تبدأ من شحنة موجبة فقط", "خطوط المستقر مغلقة دائماً على نفسها"], a: 1,

  { q: "اتجاه المجال الكهربائي المحتث (وبالتالي التيار الناتج عنه) يُحدَّد بأي قانون؟",

    why: "قانون لنز هو ما يحدّد اتجاه المجال المحتث والتيار الناتج عنه، بحيث يعارضان التغيّر المسبِّب لهما." },
  { q: "علل: خطوط المجال الكهربائي المحتث مغلقة دائماً، بعكس خطوط المجال الكهربائي المستقر.",

    why: "المجال المحتث خاصية للفضاء نفسه حيث يتغيّر B، لا خاصية للموصل — الموصل وسيلة كشف فقط، لا مصدر." }
