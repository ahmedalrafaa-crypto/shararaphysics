var ACTIVITY = {
  ch: "g6c8",
  lesson: "1",
  title: "فشل أنموذج رذرفورد وفرضيات بور",
  // نفس أسئلة "اختبر نفسك" الموجودة بنهاية الدرس (lesson1.html) — إعادة استخدام بدل التكرار.
  questions: [
  { q: "أيّ عالِم اقترح أن الذرّة كرة مصمتة موزّعة الشحنة الموجبة تتوزّع بداخلها إلكترونات سالبة؟",
    opts: ["رذرفورد", "بور", "طومسون", "دالتون"], a: 2,
    why: "طومسون هو صاحب أنموذج «الكعكة بالزبيب» — كرة موجبة الشحنة تتوزّع بداخلها إلكترونات سالبة." },
  { q: "ما السببان اللذان أدّيا إلى فشل أنموذج رذرفورد للذرّة؟",
    opts: ["الذرّة يجب أن تنهار حلزونياً (إشعاع مستمر من إلكترون معجَّل)، والنموذج يتوقع طيفاً مستمراً بينما المُشاهَد طيف خطّي", "لأن رذرفورد لم يفترض وجود نواة موجبة إطلاقاً", "لأن الذرّة وفق رذرفورد تكون موجبة الشحنة الكلية دوماً", "لا يوجد أي سبب فيزيائي حقيقي؛ النموذج صحيح تماماً"], a: 0,
    why: "الإلكترون المعجَّل يجب أن يشعّ طاقة باستمرار فينهار حلزونياً نحو النواة (تنبؤ يخالف استقرار الذرّة)، كما يتنبأ بطيف مستمر بينما طيف الهيدروجين المُشاهَد خطّي." },
  { q: "وفق فرضيات بور، متى تنتقل الذرّة إلى حالة «متهيّجة» (Excited)؟",
    opts: ["عندما تفقد الذرّة كل إلكتروناتها", "عندما يكتسب الإلكترون كمّاً من الطاقة وينتقل من مستوى استقراره إلى مستوى أعلى", "عندما تبرد الذرّة إلى الصفر المطلق", "الذرّة متهيّجة دوماً بشكل دائم لا يتغيّر"], a: 1,
    why: "الفرضية الرابعة: اكتساب الإلكترون طاقة مناسبة ينقله لمستوى أعلى (Ef)، فتصبح الذرّة متهيّجة، حتى يعود لاحقاً باعثاً فوتوناً." },
  { q: "ما الصيغة الصحيحة لشرط انبعاث أو امتصاص فوتون عند انتقال إلكتروني بين مستويين؟",
    opts: ["hf = Ef + Eᵢ", "h = f(Ef − Eᵢ)", "f = h(Ef − Eᵢ)", "hf = Ef − Eᵢ"], a: 3,
    why: "طاقة الفوتون تساوي الفرق بين مستويي الطاقة النهائي والابتدائي: hf=Ef−Eᵢ." },

    why: "الزخم الزاوي مكمّم: Lₙ=n(h/2π)، حيث n عدد صحيح موجب (العدد الكمّي الرئيس) — هذا قيد إضافي فرضه بور لم يكن موجوداً بالفيزياء الكلاسيكية." }
