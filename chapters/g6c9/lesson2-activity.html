var ACTIVITY = {
  ch: "g6c9",
  lesson: "2",
  title: "طاقة الربط النووية",
  // نفس أسئلة "اختبر نفسك" الموجودة بنهاية الدرس (lesson2.html) — إعادة استخدام بدل التكرار.
  questions: [
  { q: "لماذا تكون كتلة النواة دائماً أقل من مجموع كتل بروتوناتها ونيوتروناتها منفصلة؟",
    opts: ["لأن جزءاً من الكتلة يتحوّل إلى طاقة الربط النووية التي تماسك النواة (Eb=Δmc²)", "لأن النواة تفقد بعض بروتوناتها عند تكوّنها", "بسبب خطأ قياس دائم في كل الأجهزة المستعملة", "لأن النيوترونات عديمة الكتلة أصلاً داخل النواة"], a: 0,
    why: "النقص الكتلي Δm يكافئ طاقة الربط النووية المتحررة عند تكوّن النواة، وفق علاقة أينشتاين Eb=Δmc²." },
  { q: "ما المقصود بمعدل طاقة الربط النووية لكل نيوكليون Eb'؟",
    opts: ["مجموع كتل كل النيوكليونات بالنواة", "حاصل قسمة طاقة الربط الكلية Eb على العدد الكتلي A", "حاصل ضرب Eb في العدد الذري Z", "الفرق بين كتلة النواة وكتلة الذرّة"], a: 1,
    why: "Eb'=Eb/A — يقيس متوسط طاقة الربط لكل نيوكليون واحد بالنواة، ويُستعمل لمقارنة استقرار النوى المختلفة." },
  { q: "أي نوى العناصر تمتلك أكبر قيمة لمعدل طاقة الربط النووية Eb'، وبالتالي الأكثر استقراراً؟",
    opts: ["النوى الخفيفة جداً فقط", "النوى الثقيلة جداً فقط", "كل النوى بنفس القيمة تماماً بلا استثناء", "النوى المتوسطة (كنواة الحديد ⁵⁶Fe)"], a: 3,
    why: "منحنى Eb' مقابل A يبلغ ذروته عند النوى المتوسطة، وأشهرها نواة الحديد ⁵⁶Fe — لذا فهي الأكثر استقراراً." },
  { q: "نواة كتلتها الذرّية M، عدد بروتوناتها Z، عدد نيوتروناتها N. ما الصيغة الصحيحة للنقص الكتلي Δm (بكتل الذرّات)؟",
    opts: ["Δm = M − Z·M_H − N·mₙ", "Δm = Z·M_H + N·mₙ − M", "Δm = Z·M_H − N·mₙ + M", "Δm = Z + N − M"], a: 1,
    why: "النقص الكتلي = مجموع كتل المكوّنات منفصلة (Z ذرّات هيدروجين + N نيوترونات) ناقص كتلة الذرّة الكاملة الفعلية M." },
  { q: "طاقة الربط النووية لنواة معيّنة Eb=120 MeV وعددها الكتلي A=20. جد معدل طاقة الربط لكل نيوكليون.",
    opts: ["600 MeV/nucleon", "6 MeV/nucleon", "0.167 MeV/nucleon", "2400 MeV/nucleon"], a: 1,
    why: "Eb'=Eb/A=120/20=6 MeV/nucleon." },
  { q: "لماذا يمكن لكل من الانشطار (نوى ثقيلة) والاندماج (نوى خفيفة) أن يحرّرا طاقة هائلة، رغم أنهما عمليتان متعاكستان تماماً؟",
    opts: ["لأن كلتيهما تنقلان النوى المتفاعلة نحو منطقة النوى المتوسطة الأعلى استقراراً (أعلى Eb')، فيتحرر فرق الطاقة أثناء ذلك", "لأن الانشطار يزيد الكتلة والاندماج ينقصها بنفس المقدار دائماً", "لأنهما في الحقيقة نفس العملية الفيزيائية بمسمّيين مختلفين فقط", "لأن كلتيهما لا تغيّران نوع النوى المتفاعلة إطلاقاً"], a: 0,
    why: "النوى الثقيلة جداً (منخفضة Eb') تنشطر لتقترب من منطقة الذروة، والنوى الخفيفة جداً (منخفضة Eb' أيضاً) تندمج لتقترب من نفس المنطقة — وكلتاهما تحرّران الفرق كطاقة." }
]
