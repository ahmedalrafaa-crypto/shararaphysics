  { q: "في ربط التوازي يكون فرق الجهد:",

  { q: "مقاومتان (18Ω و 9Ω) توازي عبر (18V) — المقاومة المكافئة:",

  { q: "عند زيادة عدد المقاومات المربوطة على التوالي:",
