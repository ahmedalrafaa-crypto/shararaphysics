    why: "اندفاع الماء يدير التوربين ⟵ المولد ⟵ كهرباء." },
  { q: "كلما زاد ارتفاع منسوب الماء خلف السد فإن:",

  { q: "الفائدة العملية من تكنولوجيا طاقة المياه هي:",

    why: "تحويل طاقة الوضع في الماء إلى طاقة ميكانيكية تدير التوربينات المولّدة للكهرباء." }
