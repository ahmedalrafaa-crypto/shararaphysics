Phy.quiz("qz", [
  { q: "العتلة قضيب صلب يدور حول نقطة ثابتة تسمى:",
    opts: ["نقطة القوة", "نقطة الارتكاز", "نقطة الحمل", "محور الدوران المتحرك"], a: 1,
    why: "نقطة الارتكاز هي النقطة الثابتة التي تدور حولها العتلة." },
  { q: "الجزّازة (مقص الحديقة) مثال على عتلة النوع:",
    opts: ["الأول (الارتكاز بالوسط)", "الثاني", "الثالث", "ليست عتلة"], a: 0,
    why: "بمقص الحديقة، نقطة الارتكاز (المفصل) تقع بين مقبضي القوة وشفرتي القص (الحمل)." },
  { q: "كسّارة الجوز مثال على عتلة النوع:",
    opts: ["الأول", "الثاني (الحمل بالوسط)", "الثالث", "ليست عتلة"], a: 1,
    why: "بكسّارة الجوز، الحمل (الجوزة) يقع بالوسط بين نقطة الارتكاز والقوة المؤثرة." },
  { q: "دفع عربة على منحدر بدل رفعها عمودياً يحتاج:",
    opts: ["قوة أكبر ومسافة أقصر", "قوة أقل ومسافة أطول", "نفس القوة تماماً", "قوة أقل ومسافة أقصر معاً"], a: 1,
    why: "السطح المائل (المنحدر) يقلّل القوة اللازمة مقابل زيادة المسافة المقطوعة." },
  { q: "البرغي (البريمة) هو أساساً:",
    opts: ["عتلة ملفوفة", "سطح مائل ملفوف حول محور", "بكرة متحركة", "إسفين ثابت فقط"], a: 1,
    why: "البرغي سطح مائل ملتف حول محور أسطواني." },
  { q: "نصل الفأس مثال على آلة بسيطة من نوع:",
    opts: ["العجلة والمحور", "الإسفين", "البكرة الثابتة", "العتلة من النوع الثاني"], a: 1,
    why: "نصل الفأس إسفين يُستعمل للشق بتركيز القوة على حافة رفيعة." },
  { q: "البكرة الثابتة تفيد أساساً في:",
    opts: ["تقليل مقدار القوة اللازمة", "تغيير اتجاه القوة فقط", "مضاعفة القوة تلقائياً", "لا فائدة فيزيائية منها"], a: 1,
    why: "البكرة الثابتة تغيّر اتجاه سحب الحبل (تسحب للأسفل لترفع للأعلى) دون تقليل مقدار القوة." },
  { q: "عجلات السيارة، مع المحور الذي تدور حوله، مثال على مبدأ:",
    opts: ["العجلة والمحور", "الإسفين", "السطح المائل", "البكرة المتحركة"], a: 0,
    why: "العجلة الكبيرة (الإطار) المثبّتة بمحور صغير تدوران معاً، وهذا تعريف العجلة والمحور." },
  { q: "لتسهيل رفع حمل ثقيل بعتلة، أفضل تعديل هو تحريك نقطة الارتكاز:",
    opts: ["بعيداً عن الحمل", "قريباً من الحمل وبعيداً عن القوة", "خارج العتلة", "لا فرق لموقعها إطلاقاً"], a: 1,
    why: "كلما اقتربت نقطة الارتكاز من الحمل وابتعدت عن القوة، سهل رفع الحمل بقوة أقل." },
  { q: "أيّ العبارات تصف الفكرة المشتركة بين كل الآلات البسيطة؟",
    opts: ["تُلغي الشغل المطلوب كلياً", "تعيد توزيع الشغل بين القوة والمسافة، لا تُلغيه", "تزيد الطاقة الكلية من عدم", "لا فكرة مشتركة بينها"], a: 1,
    why: "الآلات البسيطة لا تُلغي الشغل المطلوب، بل تسمح بإنجازه بقوة أقل مقابل مسافة أطول، أو العكس." },
  { q: "ملقط تحريك الفحم (كماشة النار) مثال على عتلة النوع:",
    opts: ["الأول", "الثاني", "الثالث (القوة بالوسط)", "ليست عتلة"], a: 2,
    why: "بهذا الملقط، القوة (قبضة اليد) تقع بالوسط بين نقطة الارتكاز والحمل." },
  { q: "زاوية الإسفين الحادّة جداً (رفيعة) مقارنة بإسفين زاويته أوسع، تحتاج قوة اختراق:",
    opts: ["أكبر", "أقل", "نفس القوة تماماً", "لا علاقة للزاوية بالقوة"], a: 1,
    why: "كلما كانت زاوية الإسفين أحدّ (أرفع)، احتاج قوة أقل للاختراق — لهذا السكاكين الحادة تقطع بسهولة أكبر." }

    Phy.setExam("g2c4", stars, score, total);
    if (stars === 3) setTimeout(Phy.confetti, 800);
  }
});
