      why: "أسرع طريق: E = V/r = 3000/0.1 = 3×10⁴ V/m." },

      why: "V=kQ/r؛ وبنفس Q كلّما صغُر r ارتفع الجهد — لذا الأصغر جهدها أعلى (وهي أسرع في الانهيار)." },
