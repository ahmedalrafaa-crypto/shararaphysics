  { q: "أيّ الصيغ التالية لا تصلح لحساب الطاقة المختزنة في متسعة؟",
    opts: ["½QΔV", "½CΔV²", "Q²/2C", "½QC²"], a: 3,
    why: "الصيغ الصحيحة الثلاث: ½QΔV و½CΔV² وQ²/2C. أما ½QC² فليست منها." },
  { q: "عند مضاعفة فرق الجهد على متسعة (سعتها ثابتة)، فإن الطاقة المختزنة تصبح:",

    why: "PE = ½CΔV²؛ الطاقة تتناسب مع مربّع الجهد، فمضاعفة ΔV تجعلها 4 أمثال." },
  { q: "متسعة تختزن طاقة 10J تُفرّغها خلال 2ms. ما مقدار القدرة الناتجة؟",

    why: "P = PE/t = 10 / (2×10⁻³) = 5000 W." },
  { q: "علّل: تجهّز المتسعة قدرة لحظية أكبر بكثير من البطارية التي شحنتها.",
    opts: ["لأنها تختزن شحنة أكبر", "لأنها تُفرّغ طاقتها في زمن قصير جداً فترتفع القدرة P=PE/t", "لأن جهدها أعلى", "لأنها لا تفقد طاقة"], a: 1,
    why: "القدرة = الطاقة/الزمن؛ التفريغ في زمن ضئيل جداً يرفع القدرة اللحظية كثيراً." }
]
