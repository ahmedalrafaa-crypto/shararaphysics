  questions: [
  { q: "قضيب طوله بالسكون L₀=10m يتحرك بسرعة v=0.6c. ما طوله كما يقيسه مراقب ساكن؟",
    opts: ["8 m", "6 m", "10 m", "4 m"], a: 0,
    why: "L = L₀√(1−v²/c²) = 10×√(1−0.36) = 10×√0.64 = 10×0.8 = 8 m." },
  { q: "(سؤال وزاري — اختيار من متعدد) سفينة فضائية طولها بالسكون 40m تتحرك بسرعة 0.8c. كم يصبح طولها كما يقيسه مراقب ساكن على الأرض؟",

    why: "L = L₀√(1−v²/c²) = 40×√(1−0.64) = 40×0.6 = 24 m." },
  { q: "جسيم كتلته بالسكون m₀=2kg يتحرك بسرعة v=0.6c. جد كتلته النسبية كما يقيسها مراقب ساكن.",
    opts: [ "2 kg", "1.6 kg","2.5 kg", "3.33 kg"], a: 2,
    why: "γ=1/√(1−0.36)=1/0.8=1.25. m=m₀γ=2×1.25=2.5 kg." },
  { q: "لماذا يستحيل عملياً أن يبلغ جسمٌ له كتلة سكون سرعة الضوء؟",

    why: "بما أن m=m₀γ، وγ يكبر بلا حدود كلما اقتربت v من c، فإن كتلة الجسم النسبية تزداد بلا حدود أيضاً — ما يحتاج طاقة غير منتهية لتسريعه أكثر، وهذا مستحيل عملياً بأي مصدر طاقة محدود." },
